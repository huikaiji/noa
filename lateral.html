<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自主横向事件记录工具</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:980px;margin:12px auto;padding:10px;background:#f5f7fa;}
.box{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px #0000001a}
.btn{padding:8px 10px;margin:4px;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.btn-blue{background:#2b7bdd;color:white}
.btn-red{background:#dd3b3b;color:white}
.btn-gray{background:#888;color:white}
textarea{width:100%;min-height:220px;padding:10px;font-size:14px;border:1px solid #ccc;border-radius:6px}
#issueArea{min-height:120px;}
.input-row{margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{padding:7px;font-size:14px;border:1px solid #ccc;border-radius:6px}
.input-full{width:100%;}
.stat{background:#eef4ff;padding:12px;border-radius:8px;font-size:14px;white-space:pre-wrap;line-height:1.6}
.check-item{display:flex;align-items:center;gap:6px;margin:8px 0;}
.title-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px 0;}
h4{margin:0;font-size:16px;margin-top:12px;}
.event-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;}
.event-row select{flex:1;min-width:220px;}
.btn-line{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}

/* 匝道区：小标签式按钮，4列×3行，尺寸围绕文字 */
.ramp-group{
  margin:8px 0;
  display:grid;
  grid-template-columns: repeat(4, auto);
  grid-auto-rows: auto;
  gap:6px;
  justify-content: start;
}
.ramp-btn{
  width:auto;
  min-width:44px;
  max-width:64px;
  padding:9px 10px;
  font-size:14px;
  line-height:1;
  margin:0;
  white-space:nowrap;
  border-radius:7px;
}

.ramp-popup{
  border:1px solid #ccc;
  padding:10px;
  border-radius:8px;
  margin:8px 0 10px 0;
  display:none;
}
.ramp-popup select{
  width:100%;
  margin-bottom:8px;
}

/* ========== 手机移动端适配 ========== */
@media (max-width: 768px) {
    body {
        margin:4px auto;
        padding:6px;
    }
    .box {
        padding:10px;
    }
    textarea {
        min-height:140px !important;
        font-size:13px;
    }
    #issueArea {
        min-height:100px !important;
    }
    .stat {
        font-size:12px;
        padding:8px;
    }
    h4 {
        font-size:15px;
    }
    .btn {
        padding:7px 8px;
        font-size:12px;
    }
    .event-row select{
        min-width:160px;
    }

    /* 手机端匝道按钮进一步收紧，避免字小框大 */
    .ramp-group{
      grid-template-columns: repeat(4, auto);
      gap:5px;
      justify-content: start;
    }
    .ramp-btn{
      min-width:42px;
      max-width:60px;
      padding:10px 8px;
      font-size:15px;
      line-height:1;
    }
}
</style>
</head>
<body>
<div class="box">
<h3>🚗 自主横向事件记录工具</h3>
<div class="input-row">
<label>日期：</label>
<input id="testDate" type="date">

<label>车辆：</label>
<select id="testCar">
<option value="377车" selected>377车</option>
<option value="382车">382车</option>
<option value="383车">383车</option>
</select>

<label>重量：</label>
<select id="testWeight">
<option value="35t">35t</option>
<option value="36t">36t</option>
<option value="37t">37t</option>
<option value="38t">38t</option>
<option value="39t">39t</option>
<option value="40t" selected>40t</option>
<option value="41t">41t</option>
</select>

<label>天气：</label>
<select id="testWeather">
<option value="晴天" selected>晴天</option>
<option value="阴天">阴天</option>
<option value="雨天">雨天</option>
<option value="夜间">夜间</option>
</select>
</div>
<div class="input-row">
<label>测试总里程(km)：</label>
<input id="totalMile" type="number" placeholder="输入里程，例如300" value="300">
<label>路线：</label>
<input id="routeText" type="text" placeholder="例如：永乐东-零口" value="永乐东-腰市">
</div>

<p>正常事件直接点击按钮；其余问题下拉选择，勾选TTE后点记录；日志自动本地保存。</p>

<div>
<h4>✅正常事件记录</h4>
<div class="btn-line">
<button class="btn btn-blue" onclick="addNormalLog('正常避让')">正常避让</button>
<button class="btn btn-blue" onclick="addNormalLog('正常拨杆换道')">正常拨杆换道</button>
<button class="btn btn-blue" onclick="addNormalLog('正常自动换道')">正常自动换道</button>
<button class="btn btn-blue" onclick="addNormalLog('通过隧道')">通过隧道</button>
</div>
</div>

<div>
<h4>🔴LCC问题</h4>
<div class="event-row">
<select id="selLcc">
<option value="">--选择LCC问题--</option>
<option value="超车压线">超车压线</option>
<option value="弯道内压线">弯道内压线</option>
<option value="画龙">画龙</option>
<option value="LCC持续偏右">LCC持续偏右</option>
<option value="LCC持续偏左">LCC持续偏左</option>
</select>
<input type="checkbox" id="tteLcc">
<label for="tteLcc">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selLcc','tteLcc')">记录</button>
</div>
</div>

<div>
<h4>🔴ACC问题</h4>
<div class="event-row">
<select id="selAcc">
<option value="">--选择ACC问题--</option>
<option value="未制动">未制动</option>
<option value="动力不足">动力不足</option>
<option value="超速">超速</option>
<option value="异常制动">异常制动</option>
</select>
<input type="checkbox" id="tteAcc">
<label for="tteAcc">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selAcc','tteAcc')">记录</button>
</div>
</div>

<div>
<h4>🔴避让问题</h4>
<div class="event-row">
<select id="selAvoid">
<option value="">--选择避让问题--</option>
<option value="避让晚">避让晚</option>
<option value="避让未提示">避让未提示</option>
<option value="未避让">未避让</option>
<option value="避让压线">避让压线</option>
<option value="避让播报延迟">避让播报延迟</option>
</select>
<input type="checkbox" id="tteAvoid">
<label for="tteAvoid">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selAvoid','tteAvoid')">记录</button>
</div>
</div>

<div>
<h4>🔴换道问题</h4>
<div class="event-row">
<select id="selLc">
<option value="">--选择换道问题--</option>
<option value="拨杆换道失败">拨杆换道失败</option>
<option value="自动换道失败">自动换道失败</option>
</select>
<input type="checkbox" id="tteLc">
<label for="tteLc">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selLc','tteLc')">记录</button>
</div>
</div>

<!-- 匝道记录：12个小标签按钮，4列×3行 -->
<div>
<h4>🔴匝道记录</h4>
<div class="ramp-group">
<button class="btn btn-red ramp-btn" onclick="openRampPanel(1)">1号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(2)">2号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(3)">3号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(4)">4号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(5)">5号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(6)">6号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(7)">7号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(8)">8号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(9)">9号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(10)">10号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(11)">11号</button>
<button class="btn btn-red ramp-btn" onclick="openRampPanel(12)">12号</button>
</div>
<div id="rampPopup" class="ramp-popup">
<input type="hidden" id="currentRampNo">
<select id="selRampIssue">
<option value="通过匝道">通过匝道</option>
<option value="匝道压线">匝道压线</option>
<option value="匝道前不减速">匝道前不减速</option>
<option value="匝道内行驶左侧车道">匝道内行驶左侧车道</option>
<option value="出匝道未避让">出匝道未避让</option>
<option value="匝道转向不足">匝道转向不足</option>
<option value="匝道转向过度">匝道转向过度</option>
<option value="匝道画龙">匝道画龙</option>
<option value="匝道入口不自动汇入">匝道入口不自动汇入</option>
<option value="匝道速度过快">匝道速度过快</option>
<option value="匝道速度过慢">匝道速度过慢</option>
</select>
<div class="event-row">
<input type="checkbox" id="tteRamp">
<label for="tteRamp">TTE</label>
<button class="btn btn-red" onclick="addRampLog()">记录匝道</button>
<button class="btn btn-gray" onclick="closeRampPanel()">关闭</button>
</div>
</div>
</div>

<div>
<h4>🔔介入事件</h4>
<div class="btn-line">
<input type="checkbox" id="tteIntervene1">
<label for="tteIntervene1">TTE</label>
<button class="btn btn-red" onclick="addInterveneLog('安全介入','tteIntervene1')">安全介入</button>

<input type="checkbox" id="tteIntervene2">
<label for="tteIntervene2">TTE</label>
<button class="btn btn-red" onclick="addInterveneLog('非安全介入','tteIntervene2')">非安全介入</button>
</div>
</div>

<div>
<h4>其他自定义问题</h4>
<div class="event-row">
<input id="otherInput" placeholder="自行填写事件描述">
<input type="checkbox" id="tteOther">
<label for="tteOther">TTE</label>
<button class="btn btn-red" onclick="addOtherLogFromSelect()">记录自定义</button>
</div>
</div>

<div style="margin:10px 0;">
<button class="btn btn-blue" onclick="calcStat()">刷新完整统计</button>
<button class="btn btn-red" onclick="clearLocalLog()">清空本地日志</button>
</div>
</div>

<div class="box">
<div class="title-row">
<h4>📝原始日志输出</h4>
<button class="btn btn-blue" onclick="copyLog()">复制全部日志</button>
</div>
<textarea id="logArea"></textarea>
</div>

<div class="box">
<div class="title-row">
<h4>📌主要问题点</h4>
<button class="btn btn-blue" onclick="copyIssue()">复制主要问题</button>
</div>
<textarea id="issueArea" placeholder="在这里填写本次路测总结、主要问题、复现条件、现象描述等"></textarea>
</div>

<div class="box">
<div class="title-row">
<h4>📊完整路测统计</h4>
<button class="btn btn-blue" onclick="copyStatText()">复制路测统计</button>
</div>
<div class="stat" id="statBox"></div>
</div>

<script>
const STORAGE_KEY_LOG = "noa_lateral_log_content";
const STORAGE_KEY_ISSUE = "noa_lateral_issue_content";
const STORAGE_KEY_DATE = "noa_lateral_test_date";
const STORAGE_KEY_CAR = "noa_lateral_test_car";
const STORAGE_KEY_WEIGHT = "noa_lateral_test_weight";
const STORAGE_KEY_WEATHER = "noa_lateral_test_weather";
const STORAGE_KEY_MILE = "noa_lateral_total_mile";
const STORAGE_KEY_ROUTE = "noa_lateral_route_text";

function getTodayStr(){
    const d=new Date();
    const y=d.getFullYear();
    const m=(d.getMonth()+1).toString().padStart(2,'0');
    const day=d.getDate().toString().padStart(2,'0');
    return `${y}-${m}-${day}`;
}

function getLogHeaderText(){
    const dateVal = document.getElementById('testDate').value;
    const carVal = document.getElementById('testCar').value;
    const weightVal = document.getElementById('testWeight').value;
    const weatherVal = document.getElementById('testWeather').value;
    const routeVal = document.getElementById('routeText').value;
    const dateShow = dateVal.replace(/(\d{4})-(\d{2})-(\d{2})/, "$1年$2月$3日");
    return `${dateShow}，${carVal} ${weightVal},${weatherVal}，${routeVal}`;
}

window.onload = function(){
    const saveLog = localStorage.getItem(STORAGE_KEY_LOG);
    const saveIssue = localStorage.getItem(STORAGE_KEY_ISSUE);
    const saveDate = localStorage.getItem(STORAGE_KEY_DATE);
    const saveCar = localStorage.getItem(STORAGE_KEY_CAR);
    const saveWeight = localStorage.getItem(STORAGE_KEY_WEIGHT);
    const saveWeather = localStorage.getItem(STORAGE_KEY_WEATHER);
    const saveMile = localStorage.getItem(STORAGE_KEY_MILE);
    const saveRoute = localStorage.getItem(STORAGE_KEY_ROUTE);

    document.getElementById('testDate').value = saveDate || getTodayStr();
    document.getElementById('testCar').value = saveCar || "377车";
    document.getElementById('testWeight').value = saveWeight || "40t";
    document.getElementById('testWeather').value = saveWeather || "晴天";
    document.getElementById('totalMile').value = saveMile || "300";
    document.getElementById('routeText').value = saveRoute || "永乐东-腰市";

    if(saveLog!==null) document.getElementById('logArea').value = saveLog;
    if(saveIssue!==null) document.getElementById('issueArea').value = saveIssue;

    document.getElementById('testDate').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_DATE,document.getElementById('testDate').value);
    })
    document.getElementById('testCar').addEventListener('change',()=>{
        localStorage.setItem(STORAGE_KEY_CAR,document.getElementById('testCar').value);
    })
    document.getElementById('testWeight').addEventListener('change',()=>{
        localStorage.setItem(STORAGE_KEY_WEIGHT,document.getElementById('testWeight').value);
    })
    document.getElementById('testWeather').addEventListener('change',()=>{
        localStorage.setItem(STORAGE_KEY_WEATHER,document.getElementById('testWeather').value);
    })
    document.getElementById('totalMile').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_MILE,document.getElementById('totalMile').value);
    })
    document.getElementById('routeText').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_ROUTE,document.getElementById('routeText').value);
    })
    document.getElementById('logArea').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_LOG,document.getElementById('logArea').value);
    })
    document.getElementById('issueArea').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_ISSUE,document.getElementById('issueArea').value);
    })
}

function getNowTime(){
    let d=new Date();
    let h=d.getHours().toString().padStart(2,'0');
    let m=d.getMinutes().toString().padStart(2,'0');
    let s=d.getSeconds().toString().padStart(2,'0');
    return `${h}:${m}:${s}`;
}

function appendLogLine(line){
    const ta=document.getElementById('logArea');
    let currentText=ta.value;
    if(currentText.trim() === ""){
        currentText = getLogHeaderText() + "\n";
    }
    if(currentText!=="" && !currentText.endsWith("\n")) currentText+="\n";
    ta.value = currentText + line;
    localStorage.setItem(STORAGE_KEY_LOG,ta.value);
}

function addNormalLog(eventName){
    const time=getNowTime();
    let line=`${time} ${eventName}`;
    appendLogLine(line);
}

function addInterveneLog(typeName, tteId){
    const tteCb = document.getElementById(tteId);
    let reason = prompt(`请输入${typeName}具体原因：`,"");
    if(reason===null) return;
    const time=getNowTime();
    let line=`${time} ${typeName}：${reason.trim()}`;
    if(tteCb.checked){
        line += ` tte`;
        tteCb.checked = false;
    }
    appendLogLine(line);
}

function addLogFromSelect(selId,tteId){
    const sel = document.getElementById(selId);
    const tteCb = document.getElementById(tteId);
    const eventName = sel.value.trim();
    if(!eventName){
        alert("请先选择事件");
        return;
    }
    const time=getNowTime();
    let line=`${time} ${eventName}`;
    if(tteCb.checked){
        line += ` tte`;
        tteCb.checked = false;
    }
    appendLogLine(line);
    sel.value = "";
}

function openRampPanel(no){
    document.getElementById("currentRampNo").value = no;
    document.getElementById("rampPopup").style.display="block";
    document.getElementById("selRampIssue").value="通过匝道";
    document.getElementById("tteRamp").checked=false;
}

function closeRampPanel(){
    document.getElementById("rampPopup").style.display="none";
}

function addRampLog(){
    const no = document.getElementById("currentRampNo").value;
    const issue = document.getElementById("selRampIssue").value.trim();
    const tteCb = document.getElementById("tteRamp");
    if(!issue){
        alert("请选择匝道记录类型");
        return;
    }
    const time=getNowTime();
    let line=`${time} ${no}号${issue}`;
    if(tteCb.checked){
        line += ` tte`;
    }
    appendLogLine(line);
    closeRampPanel();
}

function addOtherLogFromSelect(){
    const input = document.getElementById('otherInput');
    const tteCb = document.getElementById('tteOther');
    const text=input.value.trim();
    if(!text){alert("请输入其他问题描述");return;}
    const time=getNowTime();
    let line=`${time} ${text}`;
    if(tteCb.checked){
        line += ` tte`;
        tteCb.checked = false;
    }
    appendLogLine(line);
    input.value='';
}

function clearLocalLog(){
    if(!confirm("确认清空全部本地日志+主要问题点？数据将无法恢复！")) return;
    document.getElementById('logArea').value = "";
    document.getElementById('issueArea').value = "";
    localStorage.removeItem(STORAGE_KEY_LOG);
    localStorage.removeItem(STORAGE_KEY_ISSUE);
}

async function copyLog(){
    const text = document.getElementById('logArea').value;
    if(!text || text.trim() === ""){
        alert("日志内容为空，无法复制");
        return;
    }
    try{
        await navigator.clipboard.writeText(text);
        alert("✅全部原始日志已复制");
    }catch(err){
        alert("❌复制失败，请手动全选拷贝");
    }
}

async function copyIssue(){
    const text = document.getElementById('issueArea').value;
    if(!text || text.trim() === ""){
        alert("主要问题点为空，无法复制");
        return;
    }
    try{
        await navigator.clipboard.writeText(text);
        alert("✅主要问题点已复制");
    }catch(err){
        alert("❌复制失败，请手动全选拷贝");
    }
}

async function copyStatText(){
    const statText = document.getElementById('statBox').innerText;
    if(!statText || statText.trim() === ""){
        alert("请先点击【刷新完整统计】生成统计内容");
        return;
    }
    try{
        await navigator.clipboard.writeText(statText);
        alert("✅路测统计已复制");
    }catch(err){
        alert("❌复制失败，请手动全选拷贝");
    }
}

function calcStat(){
    const rawText=document.getElementById('logArea').value;
    const mileInput=parseFloat(document.getElementById('totalMile').value);
    const mile = isNaN(mileInput) || mileInput <=0 ? 0 : mileInput;
    const dateStr = document.getElementById('testDate').value;
    const carStr = document.getElementById('testCar').value;
    const weightStr = document.getElementById('testWeight').value;
    const weatherStr = document.getElementById('testWeather').value;
    const routeStr = document.getElementById('routeText').value || "未填写";

    let dateShow = dateStr.replace(/(\d{4})-(\d{2})-(\d{2})/, "$1年$2月$3日");

    const lines = rawText.split('\n');
    let cnt={
        safeIntervene:0,
        unSafeIntervene:0,
        lccDragon:0,
        ilcOk:0,ilcFail:0,
        alcOk:0,alcFail:0,
        accErrBrake:0,
        avoidOk:0,avoidFail:0,
        tunnelOk:0,tunnelFail:0,
        rampOk:0,rampFail:0
    };

    lines.forEach(line=>{
        const l=line.trim();
        if(!l) return;

        if(l.includes("安全介入")) cnt.safeIntervene++;
        if(l.includes("非安全介入")) cnt.unSafeIntervene++;

        // 只有明确包含“画龙”才统计为画龙
        if(l.includes("画龙")) cnt.lccDragon++;

        if(l.includes("正常拨杆换道")) cnt.ilcOk++;
        if(l.includes("拨杆换道失败")) cnt.ilcFail++;
        if(l.includes("正常自动换道")) cnt.alcOk++;
        if(l.includes("自动换道失败")) cnt.alcFail++;
        if(l.includes("异常制动")) cnt.accErrBrake++;
        if(l.includes("正常避让")) cnt.avoidOk++;
        if(l.includes("避让晚")||l.includes("避让未提示")||l.includes("未避让")||l.includes("避让压线")||l.includes("避让播报延迟")) cnt.avoidFail++;
        if(l.includes("通过隧道")) cnt.tunnelOk++;

        if(/\d+号通过匝道/.test(l)){
            cnt.rampOk++;
        }else if(/\d+号/.test(l)){
            cnt.rampFail++;
        }
    });

    function perK(count){
        if(mile<=0) return "-";
        return (count / mile *1000).toFixed(1);
    }
    function rate(ok,fail){
        let total=ok+fail;
        if(total===0) return "100％";
        return (ok/total*100).toFixed(0)+"％";
    }

    let out="";
    out += `${dateShow}，${carStr} ${weightStr},${weatherStr}，${routeStr}\n`;
    out += `1. 总里程：${mile>0?mile:'未填写'}km\n`;
    out += `2. 安全介入次数：${cnt.safeIntervene}次，实际指标：${perK(cnt.safeIntervene)}次/千公里\n`;
    out += `3. 非安全介入次数：${cnt.unSafeIntervene}次，实际指标：${perK(cnt.unSafeIntervene)}次/千公里\n`;
    out += `4. 车道保持（画龙）：${cnt.lccDragon}次，实际指标：${perK(cnt.lccDragon)}次/千公里\n`;
    out += `5. 拨杆换道ILC：总共${cnt.ilcOk+cnt.ilcFail}次，失败${cnt.ilcFail}次，成功率：${rate(cnt.ilcOk,cnt.ilcFail)}\n`;
    out += `6. 自动换道ALC: 总共${cnt.alcOk+cnt.alcFail}次，失败${cnt.alcFail}次，成功率：${rate(cnt.alcOk,cnt.alcFail)}\n`;
    out += `7. 自适应巡航ACC: 误制动次数${cnt.accErrBrake}次，实际指标${perK(cnt.accErrBrake)}次/千公里\n`;
    out += `8. 智能避让：总共${cnt.avoidOk+cnt.avoidFail}次，失败${cnt.avoidFail}次，成功率：${rate(cnt.avoidOk,cnt.avoidFail)}\n`;
    out += `9. 隧道通行成功率：总共${cnt.tunnelOk+cnt.tunnelFail}次，失败${cnt.tunnelFail}次，成功率：${rate(cnt.tunnelOk,cnt.tunnelFail)}\n`;
    out += `10. 匝道辅助: 总共${cnt.rampOk+cnt.rampFail}次，失败${cnt.rampFail}次，成功率：${rate(cnt.rampOk,cnt.rampFail)}。`;

    document.getElementById('statBox').innerText=out;
}
</script>
</body>
</html>
