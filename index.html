<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOA路测事件记录仪</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:980px;margin:12px auto;padding:10px;background:#f5f7fa;}
.box{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px #0000001a}
.btn{padding:8px 10px;margin:4px;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.btn-blue{background:#2b7bdd;color:white}
.btn-red{background:#dd3b3b;color:white}
textarea{width:100%;min-height:260px;padding:10px;font-size:14px;border:1px solid #ccc;border-radius:6px}
#issueArea{min-height:140px;}
.confirm-overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000;}
.confirm-overlay[hidden]{display:none;}
.confirm-dialog{width:min(100%,360px);background:#fff;border-radius:10px;padding:18px;box-shadow:0 8px 30px #0003;}
.confirm-dialog p{line-height:1.6;margin:0 0 16px;}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;}
.input-row{margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta-grid{display:grid;gap:8px;margin:8px 0;align-items:center}
.form-pair{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.field-inline{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px}
.field-wide{grid-template-columns:minmax(100px,auto) minmax(0,1fr)}
.field label{font-size:13px;color:#555;white-space:nowrap}
select,input{padding:7px;font-size:14px;border:1px solid #ccc;border-radius:6px}
.field input,.field select{width:100%;min-width:0;max-width:100%;height:36px;margin:0}
@media(max-width:600px){
  body{margin:0 auto;padding:8px}
  .box{padding:12px;margin-bottom:9px}
  .form-pair{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:7px}
  .meta-grid{gap:7px}
  .field-inline{gap:5px}
  .field label{font-size:12px}
  .field-wide{grid-template-columns:105px minmax(0,1fr)}
  .field input,.field select{font-size:14px;padding:6px}
  input[type="date"]{min-width:0;letter-spacing:-.3px}
  h3{font-size:18px;margin:4px 0 10px}
}
.input-full{width:100%;}
.stat{background:#eef4ff;padding:12px;border-radius:8px;font-size:14px;white-space:pre-wrap;line-height:1.6}
.check-item{display:flex;align-items:center;gap:6px;margin:8px 0;}
.title-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px 0;}
h4{margin:0;font-size:16px;}
.event-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;}
.event-row select{flex:1;min-width:220px;}
@media(max-width:600px){
  .event-row{gap:6px}
  .event-row select{min-width:0;width:auto;flex:1 1 130px}
  .event-row .btn{margin:0;min-height:36px}
}
.btn-line{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
</style>
</head>
<body>
<div class="confirm-overlay" id="choiceEditor" hidden>
  <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="choiceEditorTitle">
    <p id="choiceEditorTitle">输入自定义内容</p>
    <input id="choiceEditorInput" type="text" style="width:100%;margin:0 0 14px;" placeholder="请输入内容">
    <div class="confirm-actions">
      <button class="btn" type="button" onclick="cancelChoiceEdit()">取消</button>
      <button class="btn btn-blue" type="button" onclick="saveChoiceEdit()">确定</button>
    </div>
  </div>
</div>
<div class="confirm-overlay" id="clearConfirm" hidden>
  <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="clearConfirmTitle">
    <p id="clearConfirmTitle">确认清空全部本地日志和主要问题点？此操作无法撤销。</p>
    <div class="confirm-actions">
      <button class="btn" type="button" onclick="cancelClearLocalLog()">取消</button>
      <button class="btn btn-red" type="button" onclick="confirmClearLocalLog()">确认清空</button>
    </div>
  </div>
</div>
<div class="box">
<h3>🚗 NOA路测事件记录仪</h3>
<div class="meta-grid form-pair">
<div class="field field-inline"><label for="testDate">日期</label>
<input id="testDate" type="date"></div>
<div class="field field-inline"><label for="testCar">车辆</label>
<select id="testCar" onchange="handleChoiceChange('testCar')">
<option value="377车" selected>377车</option>
<option value="382车">382车</option>
<option value="383车">383车</option>
<option value="251车">251车</option>
<option value="725车">725车</option>
<option value="__custom__">自定义输入…</option>
</select></div>
</div>
<div class="meta-grid form-pair">
<div class="field field-inline"><label for="testWeight">重量</label>
<select id="testWeight" onchange="handleChoiceChange('testWeight')">
<option value="35t">35t</option>
<option value="36t">36t</option>
<option value="37t">37t</option>
<option value="38t">38t</option>
<option value="39t">39t</option>
<option value="40t" selected>40t</option>
<option value="41t">41t</option>
<option value="__custom__">自定义输入…</option>
</select></div>
<div class="field field-inline"><label for="testWeather">天气</label>
<select id="testWeather">
<option value="晴天" selected>晴天</option>
<option value="阴天">阴天</option>
<option value="雨天">雨天</option>
<option value="夜间">夜间</option>
</select></div>
</div>
<div class="meta-grid field field-inline field-wide">
<label for="totalMile">总里程（km）</label>
<input id="totalMile" type="number" placeholder="例如300" value="300">
</div>
<div class="meta-grid field field-inline field-wide">
<label for="routeText">路线</label>
<input id="routeText" type="text" placeholder="例如：永乐东-零口" value="永乐东-腰市">
</div>

<p>正常事件下拉选择后点击蓝色按钮记录（无TTE）；其余问题事件选择后可勾选本行TTE再记录；日志自动本地保存</p>

<div>
<h4>✅正常事件记录（蓝色）</h4>
<div class="event-row">
<select id="normalEvent" aria-label="选择正常事件">
<option value="">--选择正常事件--</option>
<option value="正常避让">正常避让</option>
<option value="正常拨杆换道">正常拨杆换道</option>
<option value="正常自动换道">正常自动换道</option>
<option value="通过隧道">通过隧道</option>
<option value="通过匝道">通过匝道</option>
<option value="正常跟车">正常跟车</option>
<option value="正常牵扯切入">正常牵扯切入</option>
<option value="下坡→上坡">下坡→上坡</option>
<option value="上坡→下坡">上坡→下坡</option>
<option value="长上坡">长上坡</option>
<option value="上下坡">上下坡</option>
</select>
<button class="btn btn-blue" onclick="addNormalLogFromSelect()">记录正常事件</button>
</div>
</div>

<div>
<h4>🔴LCC问题</h4>
<div class="event-row">
<select id="selLcc">
<option value="">--选择LCC问题--</option>
<option value="超车压线">超车压线</option>
<option value="弯道内压线">弯道内压线</option>
<option value="画龙">画龙</option>
<option value="LCC持续偏右">LCC持续偏右</option>
<option value="LCC持续偏左">LCC持续偏左</option>
</select>
<input type="checkbox" id="tteLcc">
<label for="tteLcc">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selLcc','tteLcc')">记录</button>
</div>
</div>

<div>
<h4>🔴ACC问题</h4>
<div class="event-row">
<select id="selAcc">
<option value="">--选择ACC问题--</option>
<option value="未制动">未制动</option>
<option value="动力不足">动力不足</option>
<option value="超速">超速</option>
<option value="异常制动">异常制动</option>
</select>
<input type="checkbox" id="tteAcc">
<label for="tteAcc">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selAcc','tteAcc')">记录</button>
</div>
</div>

<div>
<h4>🔴避让问题</h4>
<div class="event-row">
<select id="selAvoid">
<option value="">--选择避让问题--</option>
<option value="避让晚">避让晚</option>
<option value="避让未提示">避让未提示</option>
<option value="未避让">未避让</option>
<option value="避让压线">避让压线</option>
<option value="避让播报延迟">避让播报延迟</option>
</select>
<input type="checkbox" id="tteAvoid">
<label for="tteAvoid">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selAvoid','tteAvoid')">记录</button>
</div>
</div>

<div>
<h4>🔴换道问题</h4>
<div class="event-row">
<select id="selLc">
<option value="">--选择换道问题--</option>
<option value="拨杆换道失败">拨杆换道失败</option>
<option value="自动换道失败">自动换道失败</option>
</select>
<input type="checkbox" id="tteLc">
<label for="tteLc">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selLc','tteLc')">记录</button>
</div>
</div>

<div>
<h4>🔴匝道问题</h4>
<div class="event-row">
<select id="selRamp">
<option value="">--选择匝道问题--</option>
<option value="匝道压线">匝道压线</option>
<option value="匝道前不减速">匝道前不减速</option>
<option value="匝道内行驶左侧车道">匝道内行驶左侧车道</option>
<option value="出匝道未避让">出匝道未避让</option>
<option value="匝道转向不足">匝道转向不足</option>
<option value="匝道转向过度">匝道转向过度</option>
<option value="匝道画龙">匝道画龙</option>
<option value="匝道入口不自动汇入">匝道入口不自动汇入</option>
<option value="匝道速度过快">匝道速度过快</option>
<option value="匝道速度过慢">匝道速度过慢</option>
</select>
<input type="checkbox" id="tteRamp">
<label for="tteRamp">TTE</label>
<button class="btn btn-red" onclick="addLogFromSelect('selRamp','tteRamp')">记录</button>
</div>
</div>

<div>
<h4>🔴纵向问题（道路形态可选）</h4>
<div class="event-row">
<select id="roadType" aria-label="道路形态">
<option value="">--道路形态--</option>
<option value="平原">平原</option>
<option value="山区">山区</option>
</select>
<select id="longitudinalType" aria-label="纵向问题类型" onchange="updateLongitudinalIssues()">
<option value="">--选择问题类型--</option>
<option value="巡航">巡航</option>
<option value="跟车">跟车</option>
<option value="PCC">PCC</option>
</select>
<select id="longitudinalIssue" aria-label="纵向问题详情" disabled>
<option value="">--先选择问题类型--</option>
</select>
<input type="checkbox" id="tteLongitudinal">
<label for="tteLongitudinal">TTE</label>
<button class="btn btn-red" onclick="addLongitudinalLog()">纵向记录</button>
</div>
</div>

<div>
<h4>🔔介入事件</h4>
<div class="btn-line">
<input type="checkbox" id="tteIntervene1">
<label for="tteIntervene1">TTE</label>
<button class="btn btn-red" onclick="addInterveneLog('安全介入','tteIntervene1')">安全介入</button>

<input type="checkbox" id="tteIntervene2">
<label for="tteIntervene2">TTE</label>
<button class="btn btn-red" onclick="addInterveneLog('非安全介入','tteIntervene2')">非安全介入</button>
</div>
</div>

<div>
<h4>其他自定义问题</h4>
<div class="event-row">
<input id="otherInput" placeholder="自行填写事件描述">
<input type="checkbox" id="tteOther">
<label for="tteOther">TTE</label>
<button class="btn btn-red" onclick="addOtherLogFromSelect()">记录自定义</button>
</div>
</div>

<div style="margin:10px 0;">
<button class="btn btn-blue" onclick="calcStat()">刷新完整统计</button>
<button class="btn btn-red" onclick="clearLocalLog()">清空本地日志</button>
</div>
</div>
<div class="box">
<div class="title-row">
<h4>📝原始日志输出（自动本地持久化）</h4>
<button class="btn btn-blue" onclick="copyLog()">复制全部日志</button>
</div>
<textarea id="logArea"></textarea>
</div>
<div class="box">
<div class="title-row">
<h4>📌主要问题点（手动编辑填写，自动保存）</h4>
<button class="btn btn-blue" onclick="copyIssue()">复制主要问题</button>
</div>
<textarea id="issueArea" placeholder="在这里填写本次路测总结、主要问题、复现条件、现象描述等"></textarea>
</div>
<div class="box">
<div class="title-row">
<h4>📊完整路测统计（点击刷新完整统计）</h4>
<button class="btn btn-blue" onclick="copyStatText()">复制路测统计</button>
</div>
<div class="stat" id="statBox"></div>
</div>
<script>
//本地存储KEY
const STORAGE_KEY_LOG = "noa_log_content";
const STORAGE_KEY_ISSUE = "noa_issue_content";
const STORAGE_KEY_DATE = "noa_test_date";
const STORAGE_KEY_CAR = "noa_test_car";
const STORAGE_KEY_WEIGHT = "noa_test_weight";
const STORAGE_KEY_WEATHER = "noa_test_weather";
const STORAGE_KEY_MILE = "noa_total_mile";
const STORAGE_KEY_ROUTE = "noa_route_text";

// 获取当前日期字符串 yyyy-MM-dd
function getTodayStr(){
    const d=new Date();
    const y=d.getFullYear();
    const m=(d.getMonth()+1).toString().padStart(2,'0');
    const day=d.getDate().toString().padStart(2,'0');
    return `${y}-${m}-${day}`;
}
//获取日志头部信息文本
function getLogHeaderText(){
    const dateVal = document.getElementById('testDate').value;
    const carVal = getCarValue();
    const weightVal = getWeightValue();
    const weatherVal = document.getElementById('testWeather').value;
    const routeVal = document.getElementById('routeText').value;
    const dateShow = dateVal.replace(/(\d{4})-(\d{2})-(\d{2})/, "$1年$2月$3日");
    return `${dateShow}，${carVal} ${weightVal},${weatherVal}，${routeVal}`;
}

//页面加载读取本地存储
window.onload = function(){
    const saveLog = localStorage.getItem(STORAGE_KEY_LOG);
    const saveIssue = localStorage.getItem(STORAGE_KEY_ISSUE);
    const saveDate = localStorage.getItem(STORAGE_KEY_DATE);
    const saveCar = localStorage.getItem(STORAGE_KEY_CAR);
    const saveWeight = localStorage.getItem(STORAGE_KEY_WEIGHT);
    const saveWeather = localStorage.getItem(STORAGE_KEY_WEATHER);
    const saveMile = localStorage.getItem(STORAGE_KEY_MILE);
    const saveRoute = localStorage.getItem(STORAGE_KEY_ROUTE);

    // 本地存储优先，没有则使用预设默认值
    document.getElementById('testDate').value = saveDate || getTodayStr();
    setSavedChoice('testCar', saveCar || "377车");
    setSavedChoice('testWeight', saveWeight || "40t");
    document.getElementById('testWeather').value = saveWeather || "晴天";
    document.getElementById('totalMile').value = saveMile || "300";
    document.getElementById('routeText').value = saveRoute || "永乐东-腰市";

    if(saveLog!==null) document.getElementById('logArea').value = saveLog;
    if(saveIssue!==null) document.getElementById('issueArea').value = saveIssue;

    //监听输入变更自动保存
    document.getElementById('testDate').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_DATE,document.getElementById('testDate').value);
    })
    document.getElementById('testWeather').addEventListener('change',()=>{
        localStorage.setItem(STORAGE_KEY_WEATHER,document.getElementById('testWeather').value);
    })
    document.getElementById('totalMile').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_MILE,document.getElementById('totalMile').value);
    })
    document.getElementById('routeText').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_ROUTE,document.getElementById('routeText').value);
    })
    document.getElementById('logArea').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_LOG,document.getElementById('logArea').value);
    })
    document.getElementById('issueArea').addEventListener('input',()=>{
        localStorage.setItem(STORAGE_KEY_ISSUE,document.getElementById('issueArea').value);
    })
}
// 单个下拉框提供预设值；自定义内容通过页面内编辑框添加到下拉选项
let activeChoiceId = null;
let lastCarValue = "377车";
let lastWeightValue = "40t";
function setSavedChoice(selectId, savedValue){
    const select = document.getElementById(selectId);
    if(!Array.from(select.options).some(option => option.value === savedValue)){
        const customOption = document.createElement('option');
        customOption.value = savedValue;
        customOption.textContent = savedValue;
        select.insertBefore(customOption, select.options[select.options.length - 1]);
    }
    select.value = savedValue;
    if(selectId === 'testCar') lastCarValue = savedValue;
    else lastWeightValue = savedValue;
}
function handleChoiceChange(selectId){
    const select = document.getElementById(selectId);
    if(select.value === '__custom__'){
        activeChoiceId = selectId;
        const isCar = selectId === 'testCar';
        document.getElementById('choiceEditorTitle').textContent = isCar ? '输入自定义车辆' : '输入自定义重量';
        const input = document.getElementById('choiceEditorInput');
        input.value = '';
        input.placeholder = isCar ? '例如：277车' : '例如：42t';
        document.getElementById('choiceEditor').hidden = false;
        input.focus();
        return;
    }
    if(selectId === 'testCar'){
        lastCarValue = select.value;
        saveCarValue();
    }else{
        lastWeightValue = select.value;
        saveWeightValue();
    }
}
function saveChoiceEdit(){
    let value = document.getElementById('choiceEditorInput').value.trim();
    if(!value){ alert('请输入自定义内容'); return; }
    if(activeChoiceId === 'testCar' && !value.endsWith('车')) value += '车';
    if(activeChoiceId === 'testWeight' && !/t$/i.test(value)) value += 't';
    const select = document.getElementById(activeChoiceId);
    let option = Array.from(select.options).find(item => item.value === value);
    if(!option){
        option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.insertBefore(option, select.options[select.options.length - 1]);
    }
    select.value = value;
    if(activeChoiceId === 'testCar'){
        lastCarValue = value;
        saveCarValue();
    }else{
        lastWeightValue = value;
        saveWeightValue();
    }
    document.getElementById('choiceEditor').hidden = true;
    activeChoiceId = null;
}
function cancelChoiceEdit(){
    if(activeChoiceId){
        document.getElementById(activeChoiceId).value = activeChoiceId === 'testCar' ? lastCarValue : lastWeightValue;
    }
    document.getElementById('choiceEditor').hidden = true;
    activeChoiceId = null;
}
function getCarValue(){ return document.getElementById('testCar').value; }
function getWeightValue(){ return document.getElementById('testWeight').value; }
function saveCarValue(){ localStorage.setItem(STORAGE_KEY_CAR, getCarValue()); }
function saveWeightValue(){ localStorage.setItem(STORAGE_KEY_WEIGHT, getWeightValue()); }

// 获取当前时分秒
function getNowTime(){
let d=new Date();
let h=d.getHours().toString().padStart(2,'0');
let m=d.getMinutes().toString().padStart(2,'0');
let s=d.getSeconds().toString().padStart(2,'0');
return `${h}:${m}:${s}`;
}
// 追加文本到日志框
function appendLogLine(line){
const ta=document.getElementById('logArea');
let currentText=ta.value;
// 如果日志为空，先写入头部信息
if(currentText.trim() === ""){
    currentText = getLogHeaderText() + "\n";
}
if(currentText!=="" && !currentText.endsWith("\n")) currentText+="\n";
ta.value = currentText + line;
localStorage.setItem(STORAGE_KEY_LOG,ta.value);
}

//正常事件按钮点击（无TTE）
function addNormalLog(eventName){
    const time=getNowTime();
    let line=`${time} ${eventName}`;
    appendLogLine(line);
}
function addNormalLogFromSelect(){
    const select = document.getElementById('normalEvent');
    const eventName = select.value;
    if(!eventName){ alert('请先选择正常事件'); return; }
    addNormalLog(eventName);
    select.value = '';
}

//介入事件按钮点击（独立TTE）
function addInterveneLog(typeName, tteId){
    const tteCb = document.getElementById(tteId);
    let reason = prompt(`请输入${typeName}具体原因：`,"");
    if(reason===null) return;
    const time=getNowTime();
    let line=`${time} ${typeName}：${reason.trim()}`;
    if(tteCb.checked){
        line += ` tte`;
        tteCb.checked = false;
    }
    appendLogLine(line);
}

// 根据巡航、跟车或PCC类型更新纵向问题二级选项
const longitudinalIssues = {
    "巡航": ["下坡超速", "弯道超速", "异常掉空档", "速度低于设定值", "动力不足", "加速过猛", "速度反复波动", "异常制动", "制动过晚", "制动过猛", "顿挫"],
    "跟车": ["跟车距离过近", "跟车距离过远", "跟车速度波动", "前车减速响应晚", "跟车制动过猛", "跟车过近未制动", "前车切入响应晚", "前车切入制动过猛", "前车切出加速恢复慢"],
    "PCC": ["下坡接上坡冲坡不足", "上坡接下坡超限速"]
};
function updateLongitudinalIssues(){
    const type = document.getElementById('longitudinalType').value;
    const issueSelect = document.getElementById('longitudinalIssue');
    issueSelect.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = type ? `--选择${type}问题--` : '--先选择问题类型--';
    issueSelect.appendChild(placeholder);
    (longitudinalIssues[type] || []).forEach(issue => {
        const option = document.createElement('option');
        option.value = issue;
        option.textContent = issue;
        issueSelect.appendChild(option);
    });
    issueSelect.disabled = !type;
}
function addLongitudinalLog(){
    const road = document.getElementById('roadType').value;
    const type = document.getElementById('longitudinalType').value;
    const issue = document.getElementById('longitudinalIssue').value;
    if(!road && (!type || !issue)){
        alert('请选择道路形态，或选择问题类型和具体问题后记录');
        return;
    }
    if(type && !issue){ alert('请先选择具体问题'); return; }
    const tteCb = document.getElementById('tteLongitudinal');
    let eventText;
    if(type && issue){
        eventText = `${road ? road + '-' : ''}${type}-${issue}`;
    }else{
        eventText = `道路形态：${road}`;
    }
    let line = `${getNowTime()} ${eventText}`;
    if(tteCb.checked){ line += ' tte'; tteCb.checked = false; }
    appendLogLine(line);
    document.getElementById('roadType').value = '';
    document.getElementById('longitudinalType').value = '';
    updateLongitudinalIssues();
}

//从下拉选择添加日志
function addLogFromSelect(selId,tteId){
    const sel = document.getElementById(selId);
    const tteCb = document.getElementById(tteId);
    const eventName = sel.value.trim();
    if(!eventName){
        alert("请先选择事件");
        return;
    }
    const time=getNowTime();
    let line=`${time} ${eventName}`;
    if(tteCb.checked){
        line += ` tte`;
        tteCb.checked = false;
    }
    appendLogLine(line);
    sel.value = "";
}

//自定义事件
function addOtherLogFromSelect(){
    const input = document.getElementById('otherInput');
    const tteCb = document.getElementById('tteOther');
    const text=input.value.trim();
    if(!text){alert("请输入其他问题描述");return;}
    const time=getNowTime();
    let line=`${time} ${text}`;
    if(tteCb.checked){
        line += ` tte`;
        tteCb.checked = false;
    }
    appendLogLine(line);
    input.value='';
}

// 使用页面内确认框，避免嵌入式浏览器屏蔽原生 confirm 对话框
function clearLocalLog(){
    document.getElementById('clearConfirm').hidden = false;
}
function cancelClearLocalLog(){
    document.getElementById('clearConfirm').hidden = true;
}
function confirmClearLocalLog(){
    document.getElementById('logArea').value = "";

    localStorage.removeItem(STORAGE_KEY_ISSUE);

//复制全部日志
async function copyLog(){
const text = document.getElementById('logArea').value;
if(!text || text.trim() === ""){
alert("日志内容为空，无法复制");
return;
}
try{
await navigator.clipboard.writeText(text);
alert("✅全部原始日志已复制");
}catch(err){
alert("❌复制失败，请浏览器允许剪贴板权限，可以手动全选拷贝");
}
}

//统计计算：使用你给的模板格式输出
function calcStat(){
const rawText=document.getElementById('logArea').value;
const mileInput=parseFloat(document.getElementById('totalMile').value);
const mile = isNaN(mileInput) || mileInput <=0 ? 0 : mileInput;
const dateStr = document.getElementById('testDate').value;
const carStr = getCarValue();
const weightStr = getWeightValue();
const weatherStr = document.getElementById('testWeather').value;
const routeStr = document.getElementById('routeText').value || "未填写";

let dateShow = dateStr.replace(/(\d{4})-(\d{2})-(\d{2})/, "$1年$2月$3日");

const lines = rawText.split('\n');
let cnt={
safeIntervene:0,
unSafeIntervene:0,
lccDragon:0,
ilcOk:0,ilcFail:0,
alcOk:0,alcFail:0,
accErrBrake:0,
avoidOk:0,avoidFail:0,
tunnelOk:0,tunnelFail:0,
rampOk:0,rampFail:0,
cruiseIssue:0,followingIssue:0,pccIssue:0
};
lines.forEach(line=>{
const l=line.trim();
if(!l) return;
if(l.includes("安全介入")) cnt.safeIntervene++;
if(l.includes("非安全介入")) cnt.unSafeIntervene++;
const eventText = l.replace(/^\d{2}:\d{2}:\d{2}\s*/, "").replace(/\s+tte\s*$/i, "").trim();
if(eventText === "画龙") cnt.lccDragon++;
if(/^(?:(?:平原|山区)-)?巡航-/.test(eventText)) cnt.cruiseIssue++;
if(/^(?:(?:平原|山区)-)?跟车-/.test(eventText)) cnt.followingIssue++;
if(/^(?:(?:平原|山区)-)?PCC-/.test(eventText)) cnt.pccIssue++;
if(l.includes("正常拨杆换道")) cnt.ilcOk++;
if(l.includes("拨杆换道失败")) cnt.ilcFail++;
if(l.includes("正常自动换道")) cnt.alcOk++;
if(l.includes("自动换道失败")) cnt.alcFail++;
if(l.includes("异常制动")) cnt.accErrBrake++;
if(l.includes("正常避让")) cnt.avoidOk++;
if(l.includes("避让晚")||l.includes("避让未提示")||l.includes("未避让")||l.includes("避让压线")||l.includes("避让播报延迟")) cnt.avoidFail++;
if(l.includes("通过隧道")) cnt.tunnelOk++;
if(l.includes("通过匝道")) cnt.rampOk++;
if(l.includes("匝道压线")||l.includes("匝道前不减速")||l.includes("匝道内行驶左侧车道")||l.includes("出匝道未避让")||l.includes("匝道转向不足")
||l.includes("匝道转向过度")||l.includes("匝道画龙")||l.includes("匝道入口不自动汇入")||l.includes("匝道速度过快")||l.includes("匝道速度过慢")) cnt.rampFail++;
});

function perK(count){
if(mile<=0) return "-";
return (count / mile *1000).toFixed(1);
}
function rate(ok,fail){
let total=ok+fail;
if(total===0) return "100％";
return (ok/total*100).toFixed(0)+"％";
}

let out="";
out += `${dateShow}，${carStr} ${weightStr},${weatherStr}，${routeStr}\n`;
out += `1. 总里程：${mile>0?mile:'未填写'}km\n`;
out += `2. 安全介入次数：${cnt.safeIntervene}次，实际指标：${perK(cnt.safeIntervene)}次/千公里\n`;
out += `3. 非安全介入次数：${cnt.unSafeIntervene}次，实际指标：${perK(cnt.unSafeIntervene)}次/千公里\n`;
out += `4. 车道保持（画龙）：${cnt.lccDragon}次，实际指标：${perK(cnt.lccDragon)}次/千公里\n`;
out += `5. 拨杆换道ILC：总共${cnt.ilcOk+cnt.ilcFail}次，失败${cnt.ilcFail}次，实际指标：${rate(cnt.ilcOk,cnt.ilcFail)}\n`;
out += `6. 自动换道ALC: 总共${cnt.alcOk+cnt.alcFail}次，失败${cnt.alcFail}次，实际指标：${rate(cnt.alcOk,cnt.alcFail)}\n`;
out += `7. 自适应巡航ACC: 误制动次数${cnt.accErrBrake}次，实际指标${perK(cnt.accErrBrake)}次/千公里\n`;
out += `8. 智能避让：总共${cnt.avoidOk+cnt.avoidFail}次，失败${cnt.avoidFail}次，实际指标：${rate(cnt.avoidOk,cnt.avoidFail)}\n`;
out += `9. 隧道通行成功率：总共${cnt.tunnelOk+cnt.tunnelFail}次，失败${cnt.tunnelFail}次，实际指标：${rate(cnt.tunnelOk,cnt.tunnelFail)}\n`;
out += `10. 匝道辅助: 总共${cnt.rampOk+cnt.rampFail}次，失败${cnt.rampFail}次，实际指标：${rate(cnt.rampOk,cnt.rampFail)}\n`;
out += `11. 纵向控制问题统计：\n`;
out += `   巡航问题：${cnt.cruiseIssue}次，${perK(cnt.cruiseIssue)}次/千公里\n`;
out += `   跟车问题：${cnt.followingIssue}次，${perK(cnt.followingIssue)}次/千公里\n`;
out += `   PCC问题：${cnt.pccIssue}次，${perK(cnt.pccIssue)}次/千公里`;
document.getElementById('statBox').innerText=out;
}
</script>
